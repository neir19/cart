serenity {
    project.name = "OpenCart - compras automatizadas"
    take.screenshots = FOR_FAILURES
    restart.browser.for.each = scenario
}

webdriver {
    driver = chrome
    autodownload = true
    wait.for.timeout = 10000

    capabilities {
        "goog:chromeOptions" {
            args = [ "--no-sandbox", "--disable-dev-shm-usage", "--window-size=1440,1000"]
        }
    }
}
